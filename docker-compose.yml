version: '3.7'
services:
  nginx:
    restart: always
    image: 'nginx:latest'
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - '3050:3050'
    depends_on:
      - api
    networks:
      - villager_network

  api:
    image: 'villager-server-backend'

    networks:
      - villager_network

networks:
  villager_network:
    external: true