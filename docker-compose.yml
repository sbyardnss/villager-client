version: '3.7'
services:
  nginx:
    restart: always
    image: 'nginx:latest'
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
      args:
        REACT_APP_API: http://localhost:8000
        REACT_APP_CONTAINER: docker
    ports:
      - '3050:3050'
    # environment:
    #   - REACT_APP_CONTAINER=docker
    # depends_on:
    #   - api
    networks:
      - villager_network

  # api:
  #   image: 'villager-server-backend'
  #   environment:
  #     - CONTAINER=docker
  #   networks:
  #     - villager_network

networks:
  villager_network:
    external: true