# }

upstream api {
  server api:8000;
}

server {
  listen 3051;
  server_name localhost; # Corrected server_name directive

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded_For $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Authorization $http_authorization; # Added line


    proxy_redirect off;
    proxy_pass http://api;
  }

  # location /sockjs-node {
  #   proxy_pass http://client;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "Upgrade";
  # }

  # location /api {
  #   rewrite /api/(.*) /$1 break;
  #   proxy_pass http://api;
  # }

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header Authorization "Token 06787add96eb3264080015997720cb0877b40f90";
    proxy_set_header Authorization $http_authorization; # Added line

  }
}
