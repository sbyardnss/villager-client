version: '3.7'
services:
  nginx:
    restart: always
    image: 'nginx:latest'
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - '3050:3051'
    depends_on:
      # - client
      - api
    networks:
      - villager_network

  api:
    image: 'villager-server-backend'
    # ports:
    #   - '8000:8000'
    networks:
      - villager_network

networks:
  villager_network:
    external: true